name: Build & Release APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout all repos into the layout expected by settings.gradle.kts ──
      - name: Checkout khwab (app)
        uses: actions/checkout@v4
        with:
          path: khwab

      - name: Checkout khwab-core
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/khwab-core
          path: khwab-core

      - name: Checkout khwab-integration
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/khwab-integration
          path: khwab-integration

      - name: Checkout khwab-aura
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/khwab-aura
          path: khwab-aura

      # ── 2. Java 17 (required by AGP 9.x) ──
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Gradle cache ──
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('khwab/**/*.gradle.kts', 'khwab/gradle/libs.versions.toml', 'khwab/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 4. Inject API keys into local.properties ──
      - name: Write local.properties
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> khwab/local.properties
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> khwab/local.properties

      # ── 5. Make gradlew executable ──
      - name: Grant execute permission for gradlew
        run: chmod +x khwab/gradlew

      # ── 6. Build release APK ──
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
        working-directory: khwab

      # ── 7. Derive release tag from versionName + run number ──
      - name: Set release tag
        id: tag
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' khwab/app/build.gradle.kts || echo "1.0")
          TAG="v${VERSION}-build.${{ github.run_number }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=Khwab ${TAG}" >> "$GITHUB_OUTPUT"

      # ── 8. Locate the built APK ──
      - name: Find APK path
        id: apk
        run: |
          APK=$(find khwab/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "path=${APK}" >> "$GITHUB_OUTPUT"

      # ── 9. Create GitHub Release and upload APK ──
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          body: |
            Automated release from commit ${{ github.sha }}

            **Branch:** `${{ github.ref_name }}`
            **Build:** #${{ github.run_number }}
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
